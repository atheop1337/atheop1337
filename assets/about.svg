  <text x="140" y="50" font-size="11" fill="#8a8a8a" class="glyph" style="animation-delay:0.0s">{ }</text>
  <text x="196" y="50" font-size="11" fill="#8a8a8a" class="glyph" style="animation-delay:1.2s">;</text>
  <text x="168" y="50" font-size="11" fill="#8a8a8a" class="glyph" style="animation-delay:2.4s">0x</text>
