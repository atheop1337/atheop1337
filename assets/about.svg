<svg xmlns="http://www.w3.org/2000/svg" width="860" height="170" viewBox="0 0 860 170" role="img" aria-label="Clawd typing code">
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.025"/>
    </pattern>
    <style>
      text { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
      .bob   { animation: bob .5s ease-in-out infinite alternate; }
      .armL  { animation: tap .28s steps(1) infinite; }
      .armR  { animation: tap .28s steps(1) .14s infinite; }
      .eye   { animation: blink 4s steps(1) infinite; }
      .key   { animation: press .7s steps(1) infinite; }
      .glyph { opacity: 0; animation: float 3.6s ease-out infinite; }
      .dot   { animation: dot 1.2s steps(1) infinite; }
      .cur   { animation: cur 1s steps(1) infinite; }
      @keyframes bob   { from { transform: translateY(0); } to { transform: translateY(1px); } }
      @keyframes tap   { 0% { transform: translateY(0); } 50% { transform: translateY(4px); } }
      @keyframes blink { 0%, 100% { fill: #0b0b0b; } 94% { fill: #e6e6e6; } 97% { fill: #0b0b0b; } }
      @keyframes press { 0%, 100% { fill: #2a2a2a; } 12% { fill: #e6e6e6; } 24% { fill: #2a2a2a; } }
      @keyframes float { 0% { opacity: 0; transform: translateY(0); } 15% { opacity: .9; } 70% { opacity: 0; transform: translateY(-22px); } 100% { opacity: 0; transform: translateY(-22px); } }
      @keyframes dot   { 0% { opacity: .15; } 33% { opacity: 1; } 66% { opacity: .15; } }
      @keyframes cur   { 50% { opacity: 0; } }
    </style>
  </defs>
